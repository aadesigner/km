kind = "web"
previewPath = "/"
title = "kmcheck"
version = "1.0.0"
id = "artifacts/kmcheck"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20941

[services.development]
run = "pnpm --filter @workspace/kmcheck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kmcheck", "run", "build" ]
publicDir = "artifacts/kmcheck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20941"
BASE_PATH = "/"
